<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1400" role="img" aria-labelledby="title description">
  <title id="title">Two-tower embedding and recommendation architecture</title>
  <desc id="description">Two-column architecture. Batch pipelines use EmbeddingGemma-300m and TwoTowerProjection to publish customer and product embeddings to BigQuery. The separate online flow embeds in-session text, projects it to 128 dimensions, combines it with customer embeddings, then matches the result against product embeddings.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf3f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#3c5875" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43849a"/>
    </marker>
    <marker id="arrow-product" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#697fb3"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .heading { fill: #172b43; font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
      .subheading { fill: #62758d; font-size: 14px; }
      .column-title { fill: #263d57; font-size: 14px; font-weight: 700; letter-spacing: 1.1px; }
      .column-subtitle { fill: #7b8da2; font-size: 12px; }
      .node-title { fill: #213852; font-size: 16px; font-weight: 700; }
      .node-copy { fill: #6c7f95; font-size: 12px; }
      .vector-title { fill: #213852; font-size: 13px; font-weight: 700; }
      .projection-title { fill: #213852; font-size: 14px; font-weight: 700; }
      .tiny { fill: #8192a6; font-size: 11px; }
      .node { fill: #ffffff; stroke: #d5e0eb; stroke-width: 1.2; }
      .source { fill: #fbfdff; stroke: #cbd9e7; stroke-width: 1.2; }
      .encoder { fill: #effaff; stroke: #91cfdb; stroke-width: 1.4; }
      .projection { fill: #f4f3ff; stroke: #c2b9e8; stroke-width: 1.4; }
      .customer { fill: #eff9f8; stroke: #a8d7ce; stroke-width: 1.3; }
      .product { fill: #f2f5fc; stroke: #bdc9e2; stroke-width: 1.3; }
      .api { fill: #f7f5ff; stroke: #cfc5ea; stroke-width: 1.4; }
      .flow { fill: none; stroke: #43849a; stroke-width: 2; marker-end: url(#arrow); }
      .product-flow { fill: none; stroke: #697fb3; stroke-width: 2; marker-end: url(#arrow-product); }
      .branch { fill: none; stroke: #43849a; stroke-width: 2; }
      .particle { fill: #38a0b3; }
      .particle-product { fill: #7189c0; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
      }
    </style>
  </defs>

  <rect width="1380" height="1400" fill="url(#page)"/>
  <text x="50" y="58" class="heading">Two-tower embeddings → recommendations</text>
  <text x="52" y="84" class="subheading">Batch pipelines publish shared BigQuery embeddings for a separate online API.</text>

  <rect x="35" y="120" width="620" height="670" rx="22" fill="#f3f8fc" stroke="#dce6ef"/>
  <rect x="35" y="810" width="620" height="360" rx="22" fill="#f7fafc" stroke="#dce6ef"/>
  <rect x="690" y="120" width="655" height="1250" rx="22" fill="#f8f7fc" stroke="#e1dced"/>

  <text x="65" y="158" class="column-title">BATCH PIPELINES</text>
  <text x="65" y="178" class="column-subtitle">Vertex AI Pipelines · separate customer / product runs</text>
  <text x="65" y="850" class="column-title">SHARED EMBEDDINGS</text>
  <text x="65" y="872" class="column-subtitle">BigQuery · projection outputs</text>
  <text x="720" y="158" class="column-title">ONLINE RECOMMENDATION</text>
  <text x="720" y="178" class="column-subtitle">Independent encoder + projection · recommendation API</text>

  <g filter="url(#shadow)">
    <rect x="65" y="190" width="250" height="65" rx="12" class="source"/>
    <text x="190" y="218" text-anchor="middle" class="node-title">Customer text</text>
    <text x="190" y="240" text-anchor="middle" class="node-copy">Long-term + mid-term</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="375" y="190" width="250" height="65" rx="12" class="source"/>
    <text x="500" y="218" text-anchor="middle" class="node-title">Product text</text>
    <text x="500" y="240" text-anchor="middle" class="node-copy">Product descriptions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="115" y="290" width="460" height="70" rx="14" class="node"/>
    <text x="345" y="320" text-anchor="middle" class="node-title">Prepare + deduplicate</text>
    <text x="345" y="342" text-anchor="middle" class="node-copy">Normalize NULL · exact text · preserve join keys</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="115" y="395" width="460" height="90" rx="14" class="encoder"/>
    <text x="345" y="433" text-anchor="middle" class="node-title">EmbeddingGemma-300m</text>
    <text x="345" y="458" text-anchor="middle" class="node-copy">Shared text encoder · Vertex batch prediction</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="75" y="525" width="170" height="90" rx="14" class="node"/>
    <text x="160" y="562" text-anchor="middle" class="vector-title">Long-term customer</text>
    <text x="160" y="587" text-anchor="middle" class="node-copy">768-d embedding</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="265" y="525" width="170" height="90" rx="14" class="node"/>
    <text x="350" y="562" text-anchor="middle" class="vector-title">Mid-term customer</text>
    <text x="350" y="587" text-anchor="middle" class="node-copy">768-d embedding</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="455" y="525" width="170" height="90" rx="14" class="node"/>
    <text x="540" y="562" text-anchor="middle" class="vector-title">Product</text>
    <text x="540" y="587" text-anchor="middle" class="node-copy">768-d embedding</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="650" width="530" height="125" rx="14" class="projection"/>
    <text x="100" y="674" class="projection-title">TwoTowerProjection</text>
    <rect x="100" y="690" width="250" height="70" rx="10" fill="#ffffff" stroke="#ded9f0"/>
    <text x="225" y="714" text-anchor="middle" class="vector-title">Customer projection</text>
    <text x="225" y="735" text-anchor="middle" class="tiny">Gated fusion</text>
    <text x="225" y="752" text-anchor="middle" class="tiny">Combined · 128-d normalized</text>
    <rect x="370" y="690" width="220" height="70" rx="10" fill="#ffffff" stroke="#ded9f0"/>
    <text x="480" y="714" text-anchor="middle" class="vector-title">Product projection</text>
    <text x="480" y="735" text-anchor="middle" class="tiny">Item tower</text>
    <text x="480" y="752" text-anchor="middle" class="tiny">128-d normalized</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="895" width="270" height="100" rx="13" class="customer"/>
    <text x="225" y="936" text-anchor="middle" class="node-title">Customer embedding</text>
    <text x="225" y="962" text-anchor="middle" class="node-copy">Long + mid · 128-d normalized</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="370" y="895" width="270" height="100" rx="13" class="product"/>
    <text x="505" y="936" text-anchor="middle" class="node-title">Product embedding</text>
    <text x="505" y="962" text-anchor="middle" class="node-copy">128-d · normalized</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="205" width="410" height="60" rx="13" class="source"/>
    <text x="1055" y="242" text-anchor="middle" class="node-title">In-session text</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="850" y="300" width="410" height="80" rx="14" class="encoder"/>
    <text x="1055" y="333" text-anchor="middle" class="node-title">EmbeddingGemma-300m</text>
    <text x="1055" y="357" text-anchor="middle" class="node-copy">Online encoder · separate instance</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="850" y="415" width="410" height="60" rx="13" class="node"/>
    <text x="1055" y="452" text-anchor="middle" class="node-title">768-d session embedding</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="850" y="500" width="410" height="80" rx="14" class="projection"/>
    <text x="1055" y="533" text-anchor="middle" class="node-title">TwoTowerProjection</text>
    <text x="1055" y="557" text-anchor="middle" class="node-copy">Online projection · separate instance</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="850" y="615" width="410" height="60" rx="13" class="node"/>
    <text x="1055" y="652" text-anchor="middle" class="node-title">128-d session vector</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="850" y="790" width="410" height="85" rx="14" class="api"/>
    <text x="1055" y="824" text-anchor="middle" class="node-title">Customer fusion + processing</text>
    <text x="1055" y="849" text-anchor="middle" class="node-copy">Combine 128-d session + customer vectors</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="850" y="910" width="410" height="60" rx="13" class="node"/>
    <text x="1055" y="947" text-anchor="middle" class="node-title">128-d context vector</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="850" y="1045" width="410" height="85" rx="14" class="api"/>
    <text x="1055" y="1079" text-anchor="middle" class="node-title">Similar-product matching</text>
    <text x="1055" y="1104" text-anchor="middle" class="node-copy">Match context against product vectors</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="850" y="1175" width="410" height="80" rx="14" class="source"/>
    <text x="1055" y="1209" text-anchor="middle" class="node-title">Product recommendations</text>
    <text x="1055" y="1232" text-anchor="middle" class="node-copy">Retrieval + ranking details TBD</text>
  </g>

  <path d="M 190 255 C 190 280 300 265 300 290" class="flow"/>
  <path d="M 500 255 C 500 280 390 265 390 290" class="product-flow"/>
  <path d="M 345 360 V 395" class="flow"/>
  <path d="M 345 485 C 345 510 160 500 160 525" class="flow"/>
  <path d="M 345 485 C 345 505 350 505 350 525" class="flow"/>
  <path d="M 345 485 C 345 510 540 500 540 525" class="product-flow"/>
  <path d="M 160 615 C 160 648 300 645 300 690" class="flow"/>
  <path d="M 350 615 C 350 650 320 655 320 690" class="flow"/>
  <path d="M 540 615 V 690" class="product-flow"/>
  <path d="M 225 760 V 895" class="flow"/>
  <path d="M 480 760 V 895" class="product-flow"/>
  <path d="M 225 995 V 1100 Q 225 1110 235 1110 H 700 Q 710 1110 710 1100 V 842 Q 710 832 720 832 H 850" class="flow"/>
  <path d="M 505 995 V 1077 Q 505 1087 515 1087 H 850" class="product-flow"/>
  <path d="M 1055 265 V 300" class="flow"/>
  <path d="M 1055 380 V 415" class="flow"/>
  <path d="M 1055 475 V 500" class="flow"/>
  <path d="M 1055 580 V 615" class="flow"/>
  <path d="M 1055 675 V 790" class="flow"/>
  <path d="M 1055 875 V 910" class="flow"/>
  <path d="M 1055 970 V 1045" class="flow"/>
  <path d="M 1055 1130 V 1175" class="flow"/>

  <circle class="particle motion" r="3">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 190 255 C 190 280 300 265 300 290"/>
  </circle>
  <circle class="particle-product motion" r="3">
    <animateMotion dur="4.4s" begin="-1s" repeatCount="indefinite" path="M 500 255 C 500 280 390 265 390 290"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="3.5s" begin="-.8s" repeatCount="indefinite" path="M 345 360 V 395"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="5s" begin="-1s" repeatCount="indefinite" path="M 345 485 C 345 510 160 500 160 525"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="5.3s" begin="-2s" repeatCount="indefinite" path="M 345 485 C 345 505 350 505 350 525"/>
  </circle>
  <circle class="particle-product motion" r="3">
    <animateMotion dur="5.6s" begin="-1.5s" repeatCount="indefinite" path="M 345 485 C 345 510 540 500 540 525"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="5s" begin="-2s" repeatCount="indefinite" path="M 160 615 C 160 648 300 645 300 690"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="5.5s" begin="-1s" repeatCount="indefinite" path="M 350 615 C 350 650 320 655 320 690"/>
  </circle>
  <circle class="particle-product motion" r="3">
    <animateMotion dur="4s" begin="-1.5s" repeatCount="indefinite" path="M 540 615 V 690"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="6s" begin="-1s" repeatCount="indefinite" path="M 225 760 V 895"/>
  </circle>
  <circle class="particle-product motion" r="3">
    <animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M 480 760 V 895"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="8s" begin="-1s" repeatCount="indefinite" path="M 225 995 V 1100 Q 225 1110 235 1110 H 700 Q 710 1110 710 1100 V 842 Q 710 832 720 832 H 850"/>
  </circle>
  <circle class="particle-product motion" r="3">
    <animateMotion dur="9s" begin="-2s" repeatCount="indefinite" path="M 505 995 V 1077 Q 505 1087 515 1087 H 850"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M 1055 265 V 300"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="4.5s" begin="-1s" repeatCount="indefinite" path="M 1055 380 V 415"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="4s" begin="-1s" repeatCount="indefinite" path="M 1055 475 V 500"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="4.5s" begin="-2s" repeatCount="indefinite" path="M 1055 580 V 615"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="5s" begin="-1s" repeatCount="indefinite" path="M 1055 675 V 790"/>
  </circle>
  <circle class="particle motion" r="3">
    <animateMotion dur="4s" begin="-1s" repeatCount="indefinite" path="M 1055 875 V 910"/>
